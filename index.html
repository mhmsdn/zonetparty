<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZonetParty — MVP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">Z</span><span>ZonetParty</span></div>
    <button class="icon-btn" id="bell">♢</button>
  </header>

  <main id="screen"></main>

  <nav class="nav">
    <button class="nav-item active" data-screen="home"><b>⌂</b><span>Home Zone</span></button>
    <button class="nav-item" data-screen="match"><b>♡</b><span>Match Zone</span></button>
    <button class="nav-item" data-screen="game"><b>◈</b><span>Game Zone</span></button>
    <button class="nav-item" data-screen="chat"><b>◌</b><span>Chat Zone</span></button>
    <button class="nav-item" data-screen="profile"><b>◎</b><span>My Zone</span></button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
